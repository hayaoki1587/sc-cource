<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SC合格講座｜学習進捗</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#1c334b;background:#f3f6fb}*{box-sizing:border-box}body{margin:0}header{background:#12375a;color:#fff;padding:22px max(18px,calc((100vw - 1100px)/2))}header a{color:#d7edff}main{max-width:1100px;margin:25px auto;padding:0 16px}h1{margin:0 0 10px;font-size:1.6rem}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin:20px 0}.card{background:#fff;border:1px solid #dce5ed;border-radius:12px;padding:17px}.card strong{font-size:1.7rem;display:block}.muted{color:#64768a}.bar{height:14px;background:#dce7ee;border-radius:20px;overflow:hidden}.bar span{display:block;background:#168a70;height:100%}.controls{display:flex;flex-wrap:wrap;gap:10px;margin:20px 0}input,select{padding:10px;border:1px solid #bac8d7;border-radius:8px;font:inherit;max-width:100%}.scroll{overflow:auto;background:#fff;border:1px solid #dce5ed;border-radius:12px}table{border-collapse:collapse;width:100%;min-width:830px}th,td{padding:11px 12px;border-bottom:1px solid #e9eef3;text-align:left;vertical-align:top}th{background:#edf3f8;position:sticky;top:0}td:nth-child(1),td:nth-child(4),td:nth-child(5){white-space:nowrap}.notes{max-width:460px;min-width:250px;font-size:.87rem;line-height:1.5}.tag{border-radius:12px;padding:3px 8px;font-size:.8rem;background:#e9eef4}.done{background:#def5eb;color:#086a49}.review{background:#fff0cc;color:#825600}a{color:#1263a3}footer{padding:20px 0;font-size:.85rem;color:#617286}@media(max-width:600px){header{padding:18px}h1{font-size:1.3rem}}
</style></head><body><header><h1>SC合格講座｜学習進捗管理表</h1><a href="index.html">← 講義一覧に戻る</a></header><main>
<p class="muted">217講の修了状況・得点・弱点・復習対象を確認できます。データはGitHubの進捗JSONから読み込みます。</p>
<div class="cards"><div class="card"><span class="muted">修了・要復習</span><strong id="completed">—</strong><span id="percent"></span></div><div class="card"><span class="muted">次の講義</span><strong id="next">—</strong><span id="nextTitle"></span></div><div class="card"><span class="muted">記録済み確認問題</span><strong id="scores">—</strong><span class="muted">得点 / 満点の合計</span></div></div>
<div class="bar" aria-label="学習進捗"><span id="fill" style="width:0%"></span></div>
<div class="controls"><input id="search" type="search" placeholder="講義名・弱点を検索" aria-label="検索"><select id="filter" aria-label="状態で絞り込み"><option value="">すべての状態</option><option value="理解済み">理解済み</option><option value="要復習">要復習</option><option value="学習中">学習中</option><option value="未学習">未学習</option></select><select id="part" aria-label="部で絞り込み"><option value="">すべての部</option></select></div>
<p id="count" class="muted"></p><div class="scroll"><table><thead><tr><th>No.</th><th>部</th><th>講義タイトル</th><th>得点</th><th>状態</th><th>最終学習日</th><th>弱点・復習メモ</th></tr></thead><tbody id="rows"><tr><td colspan="7">読み込み中...</td></tr></tbody></table></div>
<footer>元のExcelの記録を保持して移行しています。公開リポジトリに保存された情報は第三者にも閲覧可能です。</footer></main>
<script>
(async()=>{const el=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
try{const response=await fetch('data/progress.json',{cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();const all=data.lessons;if(!Array.isArray(all)||all.length!==217)throw Error('講義データの件数が不正です');
const finished=all.filter(x=>['理解済み','要復習'].includes(x.status)),next=all.find(x=>!['理解済み','要復習'].includes(x.status)),scored=all.filter(x=>typeof x.correct==='number'&&typeof x.total==='number');
const earned=scored.reduce((a,x)=>a+x.correct,0),total=scored.reduce((a,x)=>a+x.total,0),pct=(finished.length/all.length*100).toFixed(1);
el('completed').textContent=finished.length+' / '+all.length;el('percent').textContent=pct+'%';el('fill').style.width=pct+'%';el('next').textContent=next?'第'+next.no+'講':'全講修了';el('nextTitle').textContent=next?next.title:'';el('scores').textContent=earned+' / '+total;
for(const p of [...new Set(all.map(x=>x.part))]){const o=document.createElement('option');o.value=p;o.textContent=p;el('part').append(o)}
function render(){const q=el('search').value.toLowerCase(),f=el('filter').value,p=el('part').value;const list=all.filter(x=>(!f||x.status===f)&&(!p||x.part===p)&&(!q||[x.title,x.field,x.notes].some(t=>String(t??'').toLowerCase().includes(q))));
el('count').textContent=list.length+'講を表示';el('rows').innerHTML=list.map(x=>{const state=x.status==='理解済み'?'done':x.status==='要復習'?'review':'';const score=typeof x.correct==='number'?x.correct+' / '+x.total:'—';return '<tr><td>'+x.no+'</td><td>'+esc(x.part)+'</td><td><a href="lessons/'+x.no+'.html">'+esc(x.title)+'</a></td><td>'+esc(score)+'</td><td><span class="tag '+state+'">'+esc(x.status)+'</span></td><td>'+esc(x.last_studied||'—')+'</td><td class="notes">'+esc(x.notes||'—')+'</td></tr>'}).join('')||'<tr><td colspan="7">該当する講義がありません</td></tr>'}
for(const id of ['search','filter','part'])el(id).addEventListener(id==='search'?'input':'change',render);render();
}catch(e){el('rows').innerHTML='<tr><td colspan="7">進捗データを読み込めませんでした：'+String(e.message).replace(/[<>&]/g,'')+'</td></tr>';}}
)();
</script></body></html>
