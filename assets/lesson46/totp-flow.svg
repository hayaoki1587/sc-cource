<svg xmlns="http://www.w3.org/2000/svg" width="860" height="400" viewBox="0 0 860 400" role="img" aria-label="TOTPの認証処理。登録時に共有した秘密Kを認証器とサーバがそれぞれ保管し、時刻からコードを計算する。"><rect width="860" height="400" fill="#f8fafc"/><g font-family="sans-serif" fill="#172b4d" text-anchor="middle"><rect x="25" y="48" width="240" height="260" rx="14" fill="#e0f2fe" stroke="#0284c7"/><rect x="595" y="48" width="240" height="260" rx="14" fill="#dcfce7" stroke="#16a34a"/><text x="145" y="85" font-size="20" font-weight="bold">利用者の認証アプリ</text><text x="715" y="85" font-size="20" font-weight="bold">認証サーバ</text><text x="145" y="135" font-size="18">共有秘密 K（非公開）</text><text x="715" y="135" font-size="18">共有秘密 K（非公開）</text><text x="145" y="182" font-size="18">K ＋ 時刻カウンタ</text><text x="715" y="182" font-size="18">K ＋ 時刻カウンタ</text><text x="145" y="225" font-size="18">TOTPを計算</text><text x="715" y="225" font-size="18">期待TOTPを計算</text><text x="145" y="272" font-size="18">例：123456</text><text x="715" y="272" font-size="18">照合して判定</text><path d="M265 248 H585" stroke="#475569" stroke-width="3" fill="none"/><path d="M585 248 l-13 -8 v16 z" fill="#475569"/><text x="430" y="231" font-size="18">入力コードを送信</text><text x="430" y="360" font-size="16">秘密Kは送らない。コードは短時間だけ有効で、中継攻撃には注意。</text></g></svg>