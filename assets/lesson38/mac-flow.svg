<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="HMACを用いたメッセージ認証"><rect width="1000" height="380" fill="#f8fafc"/><text x="28" y="48" font-size="28" font-weight="bold" fill="#16324f">HMACを用いたメッセージ認証</text><rect x="25" y="75" width="280" height="62" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="165" y="111" text-anchor="middle" font-size="16" fill="#17395b">送信側</text><rect x="360" y="75" width="280" height="62" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="500" y="111" text-anchor="middle" font-size="16" fill="#17395b">本文 M と共有秘密鍵 K</text><rect x="695" y="75" width="280" height="62" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="835" y="111" text-anchor="middle" font-size="16" fill="#17395b">HMAC(K,M)を生成</text><path d="M305 106 H360 M640 106 H695" stroke="#2563eb" stroke-width="2"/><rect x="25" y="170" width="280" height="62" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="165" y="206" text-anchor="middle" font-size="16" fill="#17395b">ネットワーク</text><rect x="360" y="170" width="280" height="62" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="500" y="206" text-anchor="middle" font-size="16" fill="#17395b">本文 M とタグ T を送る</text><rect x="695" y="170" width="280" height="62" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="835" y="206" text-anchor="middle" font-size="16" fill="#17395b">秘密鍵 K は送らない</text><path d="M305 201 H360 M640 201 H695" stroke="#2563eb" stroke-width="2"/><rect x="25" y="265" width="280" height="62" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="165" y="301" text-anchor="middle" font-size="16" fill="#17395b">受信側</text><rect x="360" y="265" width="280" height="62" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="500" y="301" text-anchor="middle" font-size="16" fill="#17395b">同じ秘密鍵 K で再計算</text><rect x="695" y="265" width="280" height="62" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="835" y="301" text-anchor="middle" font-size="16" fill="#17395b">タグ一致なら受理</text><path d="M305 296 H360 M640 296 H695" stroke="#2563eb" stroke-width="2"/></svg>