<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-label="改ざんと再送の違い"><rect width="1000" height="380" fill="#f8fafc"/><text x="28" y="48" font-size="28" font-weight="bold" fill="#16324f">改ざんと再送の違い</text><rect x="25" y="75" width="280" height="62" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="165" y="111" text-anchor="middle" font-size="16" fill="#17395b">改ざん攻撃</text><rect x="360" y="75" width="280" height="62" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="500" y="111" text-anchor="middle" font-size="16" fill="#17395b">MをM′に書き換える</text><rect x="695" y="75" width="280" height="62" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="835" y="111" text-anchor="middle" font-size="16" fill="#17395b">タグを偽造できず検証失敗</text><path d="M305 106 H360 M640 106 H695" stroke="#2563eb" stroke-width="2"/><rect x="25" y="170" width="280" height="62" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="165" y="206" text-anchor="middle" font-size="16" fill="#17395b">再送攻撃</text><rect x="360" y="170" width="280" height="62" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="500" y="206" text-anchor="middle" font-size="16" fill="#17395b">過去の M と正規タグを再送</text><rect x="695" y="170" width="280" height="62" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="835" y="206" text-anchor="middle" font-size="16" fill="#17395b">タグが正しいため通る可能性</text><path d="M305 201 H360 M640 201 H695" stroke="#2563eb" stroke-width="2"/><rect x="25" y="265" width="280" height="62" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="165" y="301" text-anchor="middle" font-size="16" fill="#17395b">再送対策</text><rect x="360" y="265" width="280" height="62" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="500" y="301" text-anchor="middle" font-size="16" fill="#17395b">nonce・連番・時刻等を本文に含める</text><rect x="695" y="265" width="280" height="62" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="835" y="301" text-anchor="middle" font-size="16" fill="#17395b">受信側が使用済み等を拒否</text><path d="M305 296 H360 M640 296 H695" strok