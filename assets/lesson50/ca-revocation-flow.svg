<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460"><rect width="900" height="460" fill="#f8fafc"/><g font-family="sans-serif" fill="#172b4d"><text x="22" y="34" font-size="22" font-weight="bold">発行と失効確認の流れ</text><text x="22" y="64" font-size="15">発行時：申請者の確認とCA署名</text><rect x="20" y="85" width="175" height="74" rx="10" fill="#dbeafe" stroke="#2563eb"/><text x="107" y="113" text-anchor="middle" font-size="18">X社</text><text x="107" y="137" text-anchor="middle" font-size="13">鍵ペア・CSR</text><rect x="260" y="85" width="175" height="74" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="347" y="113" text-anchor="middle" font-size="18">RA</text><text x="347" y="137" text-anchor="middle" font-size="13">申請内容を審査</text><rect x="500" y="85" width="175" height="74" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="587" y="113" text-anchor="middle" font-size="18">IA / CA</text><text x="587" y="137" text-anchor="middle" font-size="13">CA鍵で署名・発行</text><rect x="735" y="85" width="145" height="74" rx="10" fill="#e0e7ff" stroke="#6366f1"/><text x="807" y="113" text-anchor="middle" font-size="17">利用者</text><text x="807" y="137" text-anchor="middle" font-size="12">証明書を検証</text><path d="M195 122H255 M435 122H495 M675 122H730" fill="none" stroke="#475569" stroke-width="2.5"/><path d="M246 116l9 6-9 6 M486 116l9 6-9 6 M721 116l9 6-9 6" fill="#475569"/><text x="22" y="210" font-size="15">漏えい後：失効を通知し、検証者が拒否する</text><rect x="20" y="238" width="175" height="82" rx="10" fill="#fee2e2" stroke="#dc2626"/><text x="107" y="267" text-anchor="middle" font-size="17">X社</text><text x="107" y="291" text-anchor="middle" font-size="13">秘密鍵漏えいを報告</text><rect x="260" y="238" width="175" height="82" rx="10" fill="#fef3c7" stroke="#d97706"/><text x="347" y="267" text-anchor="middle" font-size="17">CA</text><text x="347" y="291" text-anchor="middle" font-size="13">証明書を失効</text><rect x="500" y="238" width="175" height="82" rx="10" fill="#dcfce7" stroke="#16a34a"/><text x="587" y="267" text-anchor="middle" font-size="17">CRL / OCSP</text><text x="587" y="291" text-anchor="middle" font-size="13">失効情報を配布・応答</text><rect x="735" y="238" width="145" height="82" rx="10" fill="#e0e7ff" stroke="#6366f1"/><text x="807" y="267" text-anchor="middle" font-size="17">検証者</text><text x="807" y="291" text-anchor="middle" font-size="13">失効なら拒否</text><path d="M195 279H255 M435 279H495 M675 279H730" fill="none" stroke="#475569" stroke-width="2.5"/><path d="M246 273l9 6-9 6 M486 273l9 6-9 6 M721 273l9 6-9 6" fill="#475569"/><rect x="20" y="350" width="860" height="80" rx="10" fill="#e2e8f0"/><text x="450" y="379" text-anchor="middle" font-size="17" font-weight="bold">注意：失効処理と検証者への情報到達には時間差がある</text><text x="450" y="405" text-anchor="middle" font-size="15">失効情報の署名・更新時刻・通信失敗時の扱いを確認する</text></g></svg>