<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 402" role="img" aria-label="公開鍵すり替え攻撃"><rect width="1050" height="402" fill="#f8fafc"/><text x="32" y="48" font-size="29" font-weight="bold" fill="#17395b">公開鍵すり替え攻撃</text><rect x="24" y="80" width="312" height="66" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="180" y="118" text-anchor="middle" font-size="16" fill="#17395b">正規のA</text><rect x="371" y="80" width="312" height="66" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="527" y="118" text-anchor="middle" font-size="16" fill="#17395b">Aの秘密鍵で署名</text><rect x="718" y="80" width="312" height="66" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="874" y="118" text-anchor="middle" font-size="16" fill="#17395b">BはAの公開鍵で検証</text><path d="M336 113 H371 M683 113 H718" stroke="#2563eb" stroke-width="2"/><rect x="24" y="174" width="312" height="66" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="180" y="212" text-anchor="middle" font-size="16" fill="#17395b">攻撃者E</text><rect x="371" y="174" width="312" height="66" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="527" y="212" text-anchor="middle" font-size="16" fill="#17395b">改ざん文書にEの秘密鍵で署名</text><rect x="718" y="174" width="312" height="66" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="874" y="212" text-anchor="middle" font-size="16" fill="#17395b">Eの公開鍵をAのものと偽装</text><path d="M336 207 H371 M683 207 H718" stroke="#2563eb" stroke-width="2"/><rect x="24" y="268" width="312" height="66" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="180" y="306" text-anchor="middle" font-size="16" fill="#17395b">検証者B</text><rect x="371" y="268" width="312" height="66" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="527" y="306" text-anchor="middle" font-size="16" fill="#17395b">Eの公開鍵を誤って信用</text><rect x="718" y="268" width="312" height="66" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="874" y="306" text-anchor="middle" font-size="16" fill="#17395b">検証成功でもAの署名ではない</text><path d="M336 301 H371 M683 301 H718" stroke="#2563eb" stroke-width="2"/></svg>