<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 942" role="img" aria-label="TLS 1.3：鍵共有と相手認証を組み合わせる">
<rect width="1040" height="942" fill="#f8fafc"/>
<text x="35" y="48" font-size="26" font-weight="bold" fill="#142e4b">TLS 1.3：鍵共有と相手認証を組み合わせる</text>
<rect x="35" y="72" width="230" height="46" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
<text x="150" y="101" text-anchor="middle" font-size="18" fill="#102a43">ブラウザ</text>
<path d="M150 120 V854" stroke="#94a3b8" stroke-dasharray="6 6"/>
<rect x="775" y="72" width="230" height="46" rx="12" fill="#dbeafe" stroke="#3b82f6"/>
<text x="890" y="101" text-anchor="middle" font-size="18" fill="#102a43">サーバ</text>
<path d="M890 120 V854" stroke="#94a3b8" stroke-dasharray="6 6"/>
<path d="M150 165 H890" stroke="#2563eb" stroke-width="3"/>
<path d="M878 158 L890 165 L878 172" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="520.0" y="153" font-size="17" text-anchor="middle" fill="#1e3a8a">ClientHello + key_share</text>
<path d="M890 243 H150" stroke="#2563eb" stroke-width="3"/>
<path d="M162 236 L150 243 L162 250" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="520.0" y="231" font-size="17" text-anchor="middle" fill="#1e3a8a">ServerHello + key_share</text>
<rect x="25" y="303" width="250" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="150" y="330" font-size="15" text-anchor="middle" fill="#14532d">ECDHE共有秘密から鍵を導出</text>
<rect x="765" y="381" width="250" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/>
<text x="890" y="408" font-size="15" text-anchor="middle" fill="#14532d">ECDHE共有秘密から鍵を導出</text>
<path d="M890 477 H150" stroke="#2563eb" stroke-width="3"/>
<path d="M162 470 L150 477 L162 484" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="520.0" y="465" font-size="17" text-anchor="middle" fill="#1e3a8a">EncryptedExtensions + Certificate</text>
<path d="M890 555 H150" stroke="#2563eb" stroke-width="3"/>
<path d="M162 548 L150 555 L162 562" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="520.0" y="543" font-size="17" text-anchor="middle" fill="#1e3a8a">CertificateVerify（署名）</text>
<path d="M890 633 H150" stroke="#2563eb" stroke-width="3"/>
<path d="M162 626 L150 633 L162 640" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="520.0" y="621" font-size="17" text-anchor="middle" fill="#1e3a8a">Finished</text>
<path d="M150 711 H890" stroke="#2563eb" stroke-width="3"/>
<path d="M878 704 L890 711 L878 718" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="520.0" y="699" font-size="17" text-anchor="middle" fill="#1e3a8a">Finished</text>
<path d="M150 789 H890" stroke="#2563eb" stroke-width="3"/>
<path d="M878 782 L890 789 L878 796" fill="none" stroke="#2563eb" stroke-width="3"/>
<text x="520.0" y="777" font-size="17" text-anchor="middle" fill="#1e3a8a">暗号化したHTTPデータ</text>
<text x="36" y="907" font-size="16" fill="#334155">TLS 1.3の通常のサーバ認証付きフルハンドシェイクを簡略化。</text>
</svg>