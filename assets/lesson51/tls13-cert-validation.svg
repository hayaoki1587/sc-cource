<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610"><rect width="960" height="610" fill="#f8fafc"/><g font-family="sans-serif" fill="#172b4d"><text x="28" y="36" font-size="25" font-weight="bold">TLS 1.3：サーバ認証を伴う通常のハンドシェイク</text><rect x="55" y="64" width="235" height="55" rx="12" fill="#dbeafe" stroke="#2563eb"/><rect x="670" y="64" width="235" height="55" rx="12" fill="#dcfce7" stroke="#16a34a"/><text x="172" y="99" text-anchor="middle" font-size="20">ブラウザ</text><text x="787" y="99" text-anchor="middle" font-size="20">HTTPSサーバ</text><path d="M172 126V560 M787 126V560" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6"/><path d="M180 155H777" stroke="#2563eb" stroke-width="3"/><path d="M764 148l13 7-13 7" fill="#2563eb"/><text x="480" y="145" text-anchor="middle" font-size="17">1. ClientHello（対応方式・鍵共有情報・SNI）</text><path d="M777 210H180" stroke="#16a34a" stroke-width="3"/><path d="M193 203l-13 7 13 7" fill="#16a34a"/><text x="480" y="198" text-anchor="middle" font-size="17">2. ServerHello（方式・鍵共有情報）</text><rect x="270" y="223" width="420" height="36" rx="8" fill="#e0e7ff"/><text x="480" y="246" text-anchor="middle" font-size="15">双方が鍵共有結果からハンドシェイク鍵を導出</text><path d="M777 292H180" stroke="#16a34a" stroke-width="3"/><path d="M193 285l-13 7 13 7" fill="#16a34a"/><text x="480" y="279" text-anchor="middle" font-size="17">3. Certificate（末端＋中間CA証明書）</text><path d="M777 353H180" stroke="#16a34a" stroke-width="3"/><path d="M193 346l-13 7 13 7" fill="#16a34a"/><text x="480" y="341" text-anchor="middle" font-size="17">4. CertificateVerify（サーバ秘密鍵による署名）</text><path d="M777 415H180" stroke="#16a34a" stroke-width="3"/><path d="M193 408l-13 7 13 7" fill="#16a34a"/><text x="480" y="403" text-anchor="middle" font-size="17">5. サーバ Finished（ハンドシェイク整合性）</text><rect x="33" y="445" width="285" height="70" rx="9" fill="#fef3c7" stroke="#d97706"/><text x="175" y="469" text-anchor="middle" font-size="15">証明書チェーン・SAN・期間・用途</text><text x="175" y="490" text-anchor="middle" font-size="15">失効方針・署名等を検証</text><path d="M180 538H777" stroke="#2563eb" stroke-width="3"/><path d="M764 531l13 7-13 7" fill="#2563eb"/><text x="480" y="529" text-anchor="middle" font-size="17">6. クライアント Finished</text><text x="480" y="587" text-anchor="middle" font-size="15">成功後、導出したアプリケーション鍵でHTTPS通信を保護</text></g></svg>