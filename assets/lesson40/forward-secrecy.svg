<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 415" role="img" aria-label="ECDHEと前方秘匿性"><rect width="1100" height="415" fill="#f8fafc"/><text x="32" y="45" font-size="28" fill="#16324f">ECDHEと前方秘匿性</text><rect x="25" y="75" width="330" height="65" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="190" y="113" text-anchor="middle" font-size="17" fill="#17395b">接続時</text><rect x="390" y="75" width="330" height="65" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="555" y="113" text-anchor="middle" font-size="17" fill="#17395b">一時秘密値a,bで鍵共有</text><rect x="755" y="75" width="330" height="65" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="920" y="113" text-anchor="middle" font-size="17" fill="#17395b">通信鍵を導出</text><path d="M355 107 H390 M720 107 H755" stroke="#2563eb" stroke-width="2"/><rect x="25" y="175" width="330" height="65" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="190" y="213" text-anchor="middle" font-size="17" fill="#17395b">接続終了</text><rect x="390" y="175" width="330" height="65" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="555" y="213" text-anchor="middle" font-size="17" fill="#17395b">一時秘密値を破棄</text><rect x="755" y="175" width="330" height="65" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="920" y="213" text-anchor="middle" font-size="17" fill="#17395b">過去の暗号文は記録可能</text><path d="M355 207 H390 M720 207 H755" stroke="#2563eb" stroke-width="2"/><rect x="25" y="275" width="330" height="65" rx="10" fill="#dbeafe" stroke="#94a3b8"/><text x="190" y="313" text-anchor="middle" font-size="17" fill="#17395b">後日の鍵漏えい</text><rect x="390" y="275" width="330" height="65" rx="10" fill="#e0f2fe" stroke="#94a3b8"/><text x="555" y="313" text-anchor="middle" font-size="17" fill="#17395b">長期認証鍵が漏えい</text><rect x="755" y="275" width="330" height="65" rx="10" fill="#dcfce7" stroke="#94a3b8"/><text x="920" y="313" text-anchor="middle" font-size="17" fill="#17395b">過去の一時秘密は得られない</text><path d="M355 307 H390 M720 307 H755" stroke="#2563eb" stroke-width="2"/></svg>