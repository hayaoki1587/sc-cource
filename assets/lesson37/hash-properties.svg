<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 305" role="img" aria-label="三つの困難性を区別する"><rect width="1000" height="305" fill="#f8fafc"/><text x="35" y="48" font-size="27" font-weight="bold" fill="#16324f">三つの困難性を区別する</text><rect x="35" y="75" width="275" height="48" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="172" y="105" font-size="16" text-anchor="middle" fill="#16324f">原像：値 h が指定</text><rect x="365" y="75" width="275" height="48" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="502" y="105" font-size="16" text-anchor="middle" fill="#16324f">H(x) = h の x を探す</text><rect x="695" y="75" width="275" height="48" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="832" y="105" font-size="16" text-anchor="middle" fill="#16324f">入力を逆向きに探索</text><path d="M310 99 H365 M640 99 H695" stroke="#2563eb" stroke-width="2"/><rect x="35" y="140" width="275" height="48" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="172" y="170" font-size="16" text-anchor="middle" fill="#16324f">第二原像：文書 m が指定</text><rect x="365" y="140" width="275" height="48" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="502" y="170" font-size="16" text-anchor="middle" fill="#16324f">別文書 m′ を探す</text><rect x="695" y="140" width="275" height="48" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="832" y="170" font-size="16" text-anchor="middle" fill="#16324f">H(m) = H(m′)</text><path d="M310 164 H365 M640 164 H695" stroke="#2563eb" stroke-width="2"/><rect x="35" y="205" width="275" height="48" rx="9" fill="#dbeafe" stroke="#94a3b8"/><text x="172" y="235" font-size="16" text-anchor="middle" fill="#16324f">衝突：入力は自由</text><rect x="365" y="205" width="275" height="48" rx="9" fill="#e0f2fe" stroke="#94a3b8"/><text x="502" y="235" font-size="16" text-anchor="middle" fill="#16324f">異なる m と m′ を探す</text><rect x="695" y="205" width="275" height="48" rx="9" fill="#dcfce7" stroke="#94a3b8"/><text x="832" y="235" font-size="16" text-anchor="middle" fill="#16324f">H(m) = H(m′)</text><path d="M310 229 H365 M640 229 H695" stroke="#2563eb" stroke-width="2"/></svg>